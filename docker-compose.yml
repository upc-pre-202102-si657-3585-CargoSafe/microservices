version: '4.0'

services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    hostname: kafka
    networks:
      - app-tier
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmno1234567
    volumes:
      - kafka_data:/bitnami/kafka

  mysql-iam-service:
    image: mysql:8.0
    container_name: mysql-iam-service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: iam_service_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_iam_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password

  iam-service:
    build:
      context: iam-service
      dockerfile: docker/Dockerfile
    depends_on:
      - kafka
      - mysql-iam-service
      - eureka
    ports:
      - "8081:8081"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-iam-service:3306/iam_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
    restart: always

  mysql-companies:
    image: mysql:8.0
    container_name: mysql-companies
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: companies_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_companies_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
  companies:
    build:
      context: companies
      dockerfile: docker/Dockerfile
    depends_on:
      - kafka
      - mysql-companies
      - eureka
    ports:
      - "8082:8082"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-companies:3306/companies_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: always
  mysql-paymentcards:
    image: mysql:8.0
    container_name: mysql-paymentcards
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: paymentcards_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_paymentcards_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
  paymentcards:
    build:
      context: paymentcards
      dockerfile: docker/Dockerfile
    depends_on:
      - kafka
      - mysql-paymentcards
      - eureka
    ports:
      - "8083:8083"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-paymentcards:3306/paymentcards_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: always

  mysql-profile:
    image: mysql:8.0
    container_name: mysql-profile
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: profile_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_profile_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
  profile:
    build:
      context: profile
      dockerfile: docker/Dockerfile
    depends_on:
      - mysql-profile
      - eureka
      - kafka
    ports:
      - "8084:8084"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-profile:3306/profile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: always
  mysql-request-service:
    image: mysql:8.0
    container_name: mysql-request-service
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: request_service_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_request_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password
    restart: always
  request-service:
    build:
      context: request-service
      dockerfile: docker/Dockerfile
    depends_on:
      - mysql-request-service
      - eureka
    ports:
      - "8085:8085"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-request-service:3306/request_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: always
  mysql-trip-service:
    image: mysql:8.0
    container_name: mysql-trips-service
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: trip_service_db
    ports:
      - "3312:3306"
    volumes:
      - mysql_trip_data:/var/lib/mysql
    networks:
      - app-tier
      - 'dockernetflix-network'
    command: --default-authentication-plugin=mysql_native_password
  trip-service:
    build:
      context: trips
      dockerfile: docker/Dockerfile
    depends_on:
      - mysql-trip-service
      - eureka
    restart: always
    ports:
      - "8086:8086"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-trip-service:3306/trip_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  eureka:
    build:
      context: eureka
      dockerfile: docker/Dockerfile
    container_name: eureka-server
    restart: always
    ports:
      - "8761:8761"
    networks:
      - app-tier
      - 'dockernetflix-network'
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
      - EUREKA_INSTANCE_HOSTNAME=eureka
      - EUREKA_INSTANCE_NON_SECURE_PORT=8761
      - EUREKA_SERVER_URL=http://eureka:8761/eureka/




  api-gateway:
    build:
      context: api-gateway
      dockerfile: docker/Dockerfile
    depends_on:
      - eureka
      - iam-service
      - profile
      - companies
      - paymentcards
      - request-service
      - trip-service
    ports:
      - "8080:8080"
    networks:
      - app-tier
      - 'dockernetflix-network'
    restart: always
volumes:
  kafka_data:
  mysql_iam_data:
  mysql_companies_data:
  mysql_paymentcards_data:
  mysql_profile_data:
  mysql_request_data:
  mysql_trip_data:
networks:
  dockernetflix-network:
  app-tier:
    driver: bridge
