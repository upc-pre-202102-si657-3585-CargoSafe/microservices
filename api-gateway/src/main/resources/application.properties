## Nombre de la aplicación para identificar en Eureka
spring.application.name=api-gateway

## Puerto donde se ejecutará el gateway
server.port=${SPRING_BOOT_PORT:${DEFAULT_PORT:8080}}

## Configuración de cliente Eureka para descubrimiento de servicios
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.instance.prefer-ip-address=true

## ======= RUTAS PARA PROFILE-SERVICE =======

## Ruta general
spring.cloud.gateway.routes[0].id=profile-service
spring.cloud.gateway.routes[0].uri=lb://profile-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/profile/**

## Ruta específica para la API REST
spring.cloud.gateway.routes[3].id=profile-service-api
spring.cloud.gateway.routes[3].uri=lb://profile-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/profiles/**

## ======= RUTAS PARA IAM-SERVICE =======

## Autenticación
spring.cloud.gateway.routes[1].id=iam-authentication
spring.cloud.gateway.routes[1].uri=lb://iam-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/authentication/**
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Cookie

## Documentación Swagger
spring.cloud.gateway.routes[2].id=iam-service-swagger
spring.cloud.gateway.routes[2].uri=lb://iam-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/iam/**

## Usuarios
spring.cloud.gateway.routes[4].id=iam-users
spring.cloud.gateway.routes[4].uri=lb://iam-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/users/**

## Inspección de token interno
spring.cloud.gateway.routes[5].id=iam-users-token
spring.cloud.gateway.routes[5].uri=lb://iam-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/internal/token/inspect

## Roles
