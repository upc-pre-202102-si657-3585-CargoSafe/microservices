spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=profile-service
spring.cloud.gateway.routes[0].uri=lb://profile-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/profile/**
spring.cloud.gateway.routes[2].id=iam-service-swagger
spring.cloud.gateway.routes[2].uri=lb://iam-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/iam/**
spring.cloud.gateway.routes[1].id=iam-service-api
spring.cloud.gateway.routes[1].uri=lb://iam-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/**

springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.urls[0].name=IAM-Service
springdoc.swagger-ui.urls[0].url=/iam/v3/api-docs

springdoc.swagger-ui.urls[1].name=Profile-Service
springdoc.swagger-ui.urls[1].url=/profile/v3/api-docs
