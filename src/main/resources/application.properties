spring.application.name=iam-service
spring.datasource.url=jdbc:mysql://localhost:3306/iam-service
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.forward-headers-strategy=native

# Spring Data JPA Configuration
spring.jpa.show-sql=true
# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.dynoware.cargosafe.iamservice.shared.infrastructure.persistence.jpa.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

#spring.jpa.hibernate.naming.physical-strategy=com.dynoware.cargosafe.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Elements that take their values from the pom.xml file
documentation.application.version=@project.version@
documentation.application.description=@project.description@

# JWT Configuration Parameters
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7

# Configuración del consumidor
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=iam-service-group

# Deserializadores para la clave y el valor
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Deserializador de JSON para el valor, con el tipo esperado Map<String, Object>
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Configuración adicional del productor para LongSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.LongSerializer



