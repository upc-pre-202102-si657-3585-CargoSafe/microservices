spring.application.name=paymentcards-service
# Spring Application Name


# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3309/paymentcards-service
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.dynoware.cargosafe.paymentcardsservice.shared.infrastructure.persistence.jpa.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
server.port=${SPRING_BOOT_PORT:${DEFAULT_PORT:8083}}

# Elements that take their values from the pom.xml file
documentation.application.version=@project.version@
documentation.application.description=@project.description@
springdoc.api-docs.path=/paymentcards/v3/api-docs
springdoc.swagger-ui.path=/paymentcards/swagger-ui.html
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${DEFAULT_KAFKA_SERVER:localhost:9094}}
spring.kafka.consumer.group-id=paymentcards-service-group
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
server.forward-headers-strategy=framework

paymentcards.kafka.topic.card-created=paymentcards.card-created
paymentcards.kafka.topic.card-deleted=paymentcards.card-deleted

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.LongSerializer


spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.ack-mode=manual
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30